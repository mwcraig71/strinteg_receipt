# Render Blueprint: one web service with a persistent disk for receipt files, plus Postgres.
services:
  - type: web
    name: strinteg-receipts
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: receipt-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: strinteg-receipts-db
          property: connectionString
      - key: STORAGE_DIR
        value: /var/data/files
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INBOUND_ADDRESS
        sync: false
      - key: INBOUND_WEBHOOK_PASSWORD
        generateValue: true
      - key: MODEL_STANDARD
        value: claude-sonnet-5-5
      - key: MODEL_CAREFUL
        value: claude-opus-5-5

databases:
  - name: strinteg-receipts-db
    plan: basic-256mb
    databaseName: receipts
